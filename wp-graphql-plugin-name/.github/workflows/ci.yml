name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - release/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Used to determine what version of PHP to use for the other jobs.
      php-version: '8.2'
      php: ${{ steps.filter.outputs.php }}
      phpcs: ${{ steps.filter.outputs.phpcs }}
      phpstan: ${{ steps.filter.outputs.phpstan }}
      phpunit: ${{ steps.filter.outputs.phpunit }}
      format: ${{ steps.filter.outputs.format }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            php:
              - '**.php'
              - 'composer.*'
            phpcs:
              - '.github/workflows/ci.yml'
              - '.phpcs.xml.dist'
            phpstan:
              - '.github/workflows/ci.yml'
              - 'phpstan.neon.dist'
              - 'phpstan/**'
            phpunit:
              - '.github/workflows/ci.yml'
              - 'tests/**'
              - 'phpunit.xml.dist'
              - '.wp-env.test.json'
            format:
              - '**.json'
              - '**.md'
              - '**.yml'
              - '**.mjs'
              - '.prettier*'

  phpcs:
    name: PHPCS
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpcs == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpcs.yml@main
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}
    secrets: inherit

  phpstan:
    name: PHPStan
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpstan == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpstan.yml@main
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}
    secrets: inherit

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpunit == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpunit.yml@main
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
        wp: ['latest']
    with:
      php-version: ${{ matrix.php }}
      wp-version: ${{ matrix.wp }}
    secrets: inherit

  format:
    name: Prettier
    needs: detect
    if: needs.detect.outputs.format == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: npx --no-install prettier --check .
