name: Schema Linter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - release/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-linter:
    name: Lint WPGraphQL Schema
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: AxeWP/plugin-infra/.github/workflows/reusable-graphql-schema-linter.yml@main
    with:
      php-version: '8.2'
      plugin-slug: 'wp-graphql-plugin-name'
      # Enable once a release has published a schema.graphql asset, otherwise the download fails.
      # previous-schema-url: 'https://github.com/AxeWP/wp-graphql-plugin-name/releases/latest/download/schema.graphql'
