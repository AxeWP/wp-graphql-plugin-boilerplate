name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - release/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Used to determine what version of PHP to use for the other jobs.
      php-version: '8.2'
      php: ${{ steps.filter.outputs.php }}
      phpcs: ${{ steps.filter.outputs.phpcs }}
      phpstan: ${{ steps.filter.outputs.phpstan }}
      phpunit: ${{ steps.filter.outputs.phpunit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # The root phpcs/phpstan configs scan BOTH src/ and the plugin template,
            # so changes to either must trigger them.
            php:
              - 'src/**.php'
              - 'wp-graphql-plugin-name/**.php'
              - 'composer.*'
              - 'wp-graphql-plugin-name/composer.*'
            phpcs:
              - '.github/workflows/ci.yml'
              - '.phpcs.xml.dist'
            phpstan:
              - '.github/workflows/ci.yml'
              - 'phpstan.neon.dist'
              - 'phpstan/**'
              - 'wp-graphql-plugin-name/phpstan/**'
            # PHP changes are already covered by the `php` filter, which this job also ORs on.
            phpunit:
              - '.github/workflows/ci.yml'
              - 'wp-graphql-plugin-name/tests/**'
              - 'wp-graphql-plugin-name/phpunit.xml.dist'
              - 'wp-graphql-plugin-name/composer.*'
              - 'wp-graphql-plugin-name/package*.json'
              - 'wp-graphql-plugin-name/.wp-env*.json'
              - 'wp-graphql-plugin-name/.nvmrc'

  phpcs:
    name: PHPCS
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpcs == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpcs.yml@main
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}
    secrets: inherit

  phpstan:
    name: PHPStan
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpstan == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpstan.yml@main
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}
    secrets: inherit

  # The plugin template lives in a subdirectory, and the plugin-infra reusable workflows
  # have no working-directory input (they hardcode the repo root), so this job is inline.
  plugin-phpunit:
    name: PHPUnit (plugin template)
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpunit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: wp-graphql-plugin-name
    env:
      WP_ENV_PHP_VERSION: ${{ needs.detect.outputs.php-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ needs.detect.outputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          working-directory: wp-graphql-plugin-name

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: wp-graphql-plugin-name/.nvmrc
          cache: 'npm'
          cache-dependency-path: wp-graphql-plugin-name/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd wp-graphql-plugin-name && npm run wp-env:test start

      - name: Run PHPUnit tests
        run: npm run test:php -- --no-coverage
